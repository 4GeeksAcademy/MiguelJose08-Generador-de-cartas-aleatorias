<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./assets/img/4geeks.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador de Cartas Aleatorias</title>
    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fontawesome is our recomended library for icons -->
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.2.0/css/all.css"
      integrity="sha384-hWVjflwFxL6sNzntih27bfxkr27PmbbK/iSvJ+a4+0owXq79v+lsFkW54bOGbiDQ"
      crossorigin="anonymous"
    />
  </head>
  <body>

    <!--Contenedor General-->
<div class="d-flex flex-column align-items-center mt-5">
      <!-- Contenedor principal de la carta -->
  <div class="card my-custom-card mx-auto mt-5 shadow-lg">
    <div class="card-body d-flex flex-column justify-content-between">
      
      <!-- Palo superior izquierdo -->
      <div class="top-suit text-start fs-1">
        ♥
      </div>
      
      <!-- Número/Letra central -->
      <div class="number text-center display-1 fw-bold">
        A
      </div>
      
      <!-- Palo inferior derecho (necesita CSS para voltearse) -->
      <div class="bottom-suit text-start fs-1">
        ♥
      </div>
      
    </div>
  </div>

  <!--Boton generador de carta-->
  <button id="btn-generar" class="btn btn-primary mt-4">Generar nueva carta</button>

  <!--Boton cambio de tamamo-->
  <div class="d-flex justify-content-center gap-2 my-3">
    <input type="number" id="input-ancho" class="form-control w-25" placeholder="Ancho">
    <input type="number" id="input-alto" class="form-control w-25" placeholder="Alto">
    <button id="btn-tamano" class="btn btn-success">Aplicar Tamaño</button>
  </div>
</div>

    <!-- Do not delete this script tag, this is what connects your HTML with the Javascript code -->
    <script type="module" src="/app.js"></script>
  </body>
</html>
